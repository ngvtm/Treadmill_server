name: host-tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Run host unit tests
        run: sh test/run_host_tests.sh
