<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Các cách lắp sensor — mặt cắt ngang băng chạy</title>
<style>
  :root {
    --surface-1:#fcfcfb; --page:#f9f9f7; --text-primary:#0b0b0b; --text-secondary:#52514e;
    --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
    --good:#0ca30c; --warning:#eda100; --critical:#d03b3b;
    --belt:#d9dde2; --frame:#8a8f96; --sensor:#2a78d6; --beam:#3987e5; --child:#4a3aa7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1:#1a1a19; --page:#0d0d0d; --text-primary:#fff; --text-secondary:#c3c2b7;
      --muted:#898781; --grid:#2c2c2a; --axis:#383835;
      --good:#0ca30c; --warning:#eda100; --critical:#d03b3b;
      --belt:#33373d; --frame:#6a6f76; --sensor:#3987e5; --beam:#3987e5; --child:#9085e9;
    }
  }
  body { margin:0; padding:24px; background:var(--page); color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.5; }
  .wrap { max-width:920px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { color:var(--text-secondary); font-size:14px; margin:4px 0; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px; }
  @media (max-width:720px){ .grid{ grid-template-columns:1fr; } }
  .card { background:var(--surface-1); border-radius:10px; padding:14px;
    border:1px solid rgba(11,11,11,0.10); }
  .card h2 { font-size:15px; margin:0 0 2px; display:flex; align-items:center; gap:8px; }
  .tag { font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; color:#fff; }
  .tag.bad { background:var(--critical); }
  .tag.ok { background:var(--good); }
  .tag.mid { background:var(--warning); color:#3a2c00; }
  .card p { font-size:12.5px; }
  svg { width:100%; height:auto; display:block; margin:6px 0; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; margin:10px 0; }
  .legend span { display:inline-flex; align-items:center; gap:6px; color:var(--text-secondary); }
  .sw { width:13px; height:13px; border-radius:3px; display:inline-block; }
  ul { margin:6px 0 0; padding-left:18px; font-size:12.5px; color:var(--text-secondary); }
  li { margin:2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Các cách lắp sensor — mặt cắt ngang (nhìn từ hông băng)</h1>
  <p>Đường kẻ ngang = mặt băng chạy. Trẻ đứng trên băng (tím). Tia sensor màu xanh; vùng đỏ = tia quét trúng mặt băng gây nhiễu, hoặc gờ gây vấp.</p>
  <div class="legend">
    <span><i class="sw" style="background:var(--sensor)"></i> Sensor</span>
    <span><i class="sw" style="background:var(--beam);opacity:.4"></i> Chùm tia (nón 25°)</span>
    <span><i class="sw" style="background:var(--child)"></i> Chân/thân trẻ</span>
    <span><i class="sw" style="background:var(--critical)"></i> Vùng rủi ro</span>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script src="sensor_mounting.js"></script>
</body>
</html>
